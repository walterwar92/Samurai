name: CI

# Why scoped: full requirements.txt pulls in RPi.GPIO / picamera2 / smbus2
# which won't install on a Linux runner. CI here covers what is testable
# without hardware: pure-Python control logic, frontend type-check, and a
# repo-wide compile-check so syntax errors in any node are caught early.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # Only deps the pure-Python unit tests actually need. Avoids
          # RPi.GPIO / picamera2 / smbus2 etc. which are arm64 / Pi-only.
          pip install pytest pytest-cov orjson python-statemachine paho-mqtt pydantic
      - name: Run pure-Python unit tests
        run: |
          pytest \
            tests/test_collision_policy.py \
            tests/test_imu_push_detector.py \
            tests/test_drive_state.py \
            tests/test_ekf_imu.py \
            tests/test_velocity_ekf.py \
            tests/test_schemas.py \
            -v --tb=short

  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile every .py
        run: |
          # Walk the repo and byte-compile each Python file. Catches typos
          # and broken syntax without needing hardware deps installed.
          # ros_ws/build is excluded — autogenerated build artefacts.
          python -m compileall -q \
            -x '(\.git|node_modules|ros_ws/build|ros_ws/install|ros_ws/log)' \
            .

  frontend-typecheck:
    name: Frontend type-check + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compute_node/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: compute_node/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npx tsc -b --noEmit
      - name: Lint
        run: npx eslint . --max-warnings=0
        continue-on-error: true   # baseline lint debt — fail-soft until cleaned
      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css,md}"
        continue-on-error: true   # baseline formatting drift — fail-soft

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compute_node/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: compute_node/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
