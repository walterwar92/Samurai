; =============================================================================
; Samurai Robot — ESP32-WROOM-32 firmware
; =============================================================================
; Replaces Pi-side hardware nodes:
;   motor, imu, ultrasonic, battery, head, arm, led
;
; Build & upload:
;   pio run -t upload
;   pio run -t upload --upload-port COM3   (explicit port)
;
; Monitor serial:
;   pio device monitor -b 115200
;
; OTA update (after first flash):
;   pio run -t upload --upload-port <ESP32_IP>

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

; --- CPU / Flash ---
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
monitor_speed = 115200

; --- Partition: OTA support (two app slots) ---
board_build.partitions = min_spiffs.csv

; --- Libraries ---
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    adafruit/Adafruit PWM Servo Driver Library@^3.0
    fastled/FastLED@^3.7

; --- Build flags ---
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
